name: afk-cloud Continuous Delivery & Rollback

on:
  push:
    branches: [main]
    paths:
      - 'edge/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy-edge:
    name: Cloudflare Worker Deploy & Automated Health Rollback
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Pre-deployment Typecheck
        run: |
          pnpm typecheck
          npx tsc --noEmit -p edge/tsconfig.json

      - name: Check Cloudflare Credentials
        id: cf_check
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "has_token=true" >> $GITHUB_OUTPUT
          else
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "ℹ️ 未检测到 CLOUDFLARE_API_TOKEN，跳过生产部署步骤 (Dry-run)"
          fi

      - name: Generate Wrangler Runtime Config
        if: steps.cf_check.outputs.has_token == 'true'
        env:
          D1_ID: ${{ secrets.AFK_D1_DATABASE_ID }}
          KV_ID: ${{ secrets.AFK_KV_NAMESPACE_ID }}
        run: |
          if [ ! -f edge/wrangler.jsonc ]; then
            if [ -z "$D1_ID" ] || [ -z "$KV_ID" ]; then
              echo "❌ 缺少 AFK_D1_DATABASE_ID 或 AFK_KV_NAMESPACE_ID Secret，无法生成 wrangler.jsonc"
              exit 1
            fi
            node -e '
              const fs = require("fs");
              const cfg = {
                "$schema": "node_modules/wrangler/config-schema.json",
                "name": "chaoxing-dashboard-worker",
                "main": "src/index.ts",
                "compatibility_date": "2024-11-01",
                "compatibility_flags": ["nodejs_compat"],
                "keep_vars": true,
                "triggers": { "crons": ["* * * * *"] },
                "d1_databases": [
                  {
                    "binding": "DB",
                    "database_name": "afk-cloud-db",
                    "database_id": process.env.D1_ID
                  }
                ],
                "kv_namespaces": [
                  {
                    "binding": "CHAOXING_KV",
                    "id": process.env.KV_ID
                  }
                ],
                "durable_objects": {
                  "bindings": [
                    { "name": "SIGN_AGENT", "class_name": "SignAgent" },
                    { "name": "SOLVER_AGENT", "class_name": "SolverAgent" }
                  ]
                },
                "migrations": [
                  { "tag": "v1", "new_sqlite_classes": ["SignAgent", "SolverAgent"] }
                ]
              };
              fs.writeFileSync("edge/wrangler.jsonc", JSON.stringify(cfg, null, 2) + "\n");
            '
          fi

      - name: Apply Remote D1 Migrations
        if: steps.cf_check.outputs.has_token == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'edge'
          command: d1 migrations apply DB --remote

      - name: Deploy to Cloudflare Workers
        if: steps.cf_check.outputs.has_token == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'edge'
          command: deploy --keep-vars

      - name: Post-Deployment Observability Probe & Rollback Guard
        if: steps.cf_check.outputs.has_token == 'true'
        run: |
          PROBE_URL="${{ secrets.AFK_ENDPOINT_URL || 'https://afk.idiotshoumy.com' }}/health"
          echo "📡 正在对上线服务执行端到端健康可观测性探测: $PROBE_URL"

          MAX_RETRIES=5
          SUCCESS=0
          for i in $(seq 1 $MAX_RETRIES); do
            echo "第 $i 次探测中..."
            HTTP_CODE=$(curl -s -o /tmp/health_resp.json -w "%{http_code}" "$PROBE_URL" || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              HEALTH_OK=$(node -e "
                try {
                  const j = JSON.parse(require('fs').readFileSync('/tmp/health_resp.json', 'utf8'));
                  const ok = j.status === 'healthy' && (!j.components || !j.components.d1 || j.components.d1.status === 'healthy');
                  process.stdout.write(ok ? 'true' : 'false');
                } catch { process.stdout.write('false'); }
              ")
              if [ "$HEALTH_OK" = "true" ]; then
                echo "✅ 边缘服务健康检查完全通过 (HTTP 200, status: healthy)"
                cat /tmp/health_resp.json
                echo ""
                SUCCESS=1
                break
              fi
            fi
            sleep 5
          done

          if [ $SUCCESS -ne 1 ]; then
            echo "❌ [ALERT] 新版本上线后健康探测连续失败，触发故障自动熔断回滚！"
            exit 1
          fi

      - name: Trigger Automated Rollback on Failure
        if: failure() && steps.cf_check.outputs.has_token == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'edge'
          command: 'rollback --yes --message "Automated rollback: post-deploy /health observability probe failed"'
